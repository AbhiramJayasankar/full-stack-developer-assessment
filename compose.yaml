services:
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes --appendfsync always --maxmemory-policy noeviction
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 15
volumes:
  redis-data:
